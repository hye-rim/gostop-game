<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>맞고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 아이폰 사파리는 -webkit- 접두사를 붙여야 알아듣는다: 버튼을 누르다 글자가 파랗게 선택(블록)되거나
     길게 눌러 복사 메뉴가 뜨지 않게. 입력칸은 그대로 선택·붙여넣기 되게 둔다 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea, [contenteditable] { -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }

  /* 작은 오락실 공통 스티커 스타일: 진한 남보라 테두리 + 아래로 떨어진 그림자 + 둥근 글꼴 */
  :root { --ink:#2b1d52; --yellow:#ffd23f; --pink:#ff5fa2; --muted:#6b5c95; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:
      repeating-linear-gradient(-30deg, rgba(255,255,255,.07) 0 26px, transparent 26px 56px),
      linear-gradient(180deg, #4f8cff 0%, #6b5cff 55%, #8a4fe0 100%);
    font-family:'Jua', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color:var(--ink);
    touch-action:none;
  }
  #stage { width:100%; height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; }
  #hud { display:flex; align-items:center; gap:6px; padding:0 2px 8px; font-variant-numeric:tabular-nums; width:100%; position:relative; z-index:2; }
  #hud .item {
    display:flex; align-items:center; gap:5px; white-space:nowrap;
    background:#fff; border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink);
    padding:2px 12px; height:38px;
  }
  #hud .item.score { background:var(--yellow); flex:1; min-width:0; }
  #hud .label { font-size:11px; color:var(--muted); }
  #hud .item.score .label { color:#8a5a00; }
  #hud .value { font-size:21px; }
  #hud .icons { display:flex; gap:6px; margin-left:auto; }
  #hud button {
    background:#fff; border:3px solid var(--ink); color:var(--ink); position:relative;
    width:36px; height:36px; border-radius:12px; font-size:15px; cursor:pointer; box-shadow:0 4px 0 var(--ink);
  }
  #hud button::after { content:''; position:absolute; inset:-10px -6px; }
  #hud button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }

  #wrap { position:relative; }

  #overlay {
    position:absolute; inset:0; z-index:40;
    display:flex; flex-direction:column; align-items:center; justify-content:safe center; gap:12px;
    text-align:center; padding:18px; background:rgba(43,29,82,.74); border-radius:22px;
    backdrop-filter:blur(3px); overflow-y:auto; touch-action:pan-y;
  }
  #overlay.hidden { display:none; }
  #overlay h1, #overlay h2 { color:#fff; font-weight:400; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #overlay h1 { font-size:clamp(40px, 12vw, 54px); line-height:1.05; color:var(--yellow); }
  #overlay h2 { font-size:30px; }
  #overlay p { font-size:14px; line-height:1.55; color:#fff; }
  #overlay p b { color:var(--yellow); font-weight:400; }
  #overlay .big { font-size:48px; color:var(--yellow); font-variant-numeric:tabular-nums; line-height:1; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #overlay .tag { display:inline-block; background:var(--pink); color:#fff; font-size:15px; padding:3px 14px; border-radius:999px; border:3px solid var(--ink); box-shadow:0 3px 0 var(--ink); }
  #overlay .card2 {
    font-size:14px; color:var(--ink); line-height:1.7; text-align:left; background:#fff; border:3px solid var(--ink);
    border-radius:18px; box-shadow:0 5px 0 var(--ink); padding:10px 16px;
  }
  #overlay .stats { display:grid; grid-template-columns:auto auto; gap:3px 18px; font-size:16px; font-variant-numeric:tabular-nums; }
  #overlay .stats dt { color:var(--muted); text-align:right; }
  #overlay button {
    background:var(--yellow); color:var(--ink); font-size:21px; font-family:inherit; border:3px solid var(--ink);
    border-radius:999px; padding:10px 36px; box-shadow:0 5px 0 var(--ink); cursor:pointer;
  }
  #overlay button small { display:block; font-size:12px; color:var(--muted); margin-top:1px; }
  #overlay button.sub { background:#fff; font-size:16px; padding:7px 22px; box-shadow:0 4px 0 var(--ink); }
  #overlay button:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  #overlay .col { display:flex; flex-direction:column; align-items:center; gap:9px; }

  @media (max-width:420px) {
    #hud { gap:4px; }
    #hud .label { display:none; }
    #hud .item { padding:2px 10px; height:34px; box-shadow:0 3px 0 var(--ink); }
    #hud .value { font-size:17px; }
    #hud button { width:32px; height:32px; font-size:13px; box-shadow:0 3px 0 var(--ink); }
  }
  @media (max-height:700px) {
    #overlay { gap:8px; padding:12px; }
    #overlay h1 { font-size:38px; } #overlay h2 { font-size:26px; } #overlay .big { font-size:38px; }
    #overlay p, #overlay .card2 { font-size:12.5px; }
    #overlay button { font-size:18px; padding:8px 28px; }
  }

  #col { width:min(100%, 420px); }
  #wrap { position:relative; width:100%; }
  #hud .item.score .value { font-size:16px; overflow:hidden; text-overflow:ellipsis; }
  #table { background:linear-gradient(180deg,#1f7a4a,#176a3e); border:4px solid var(--ink); border-radius:20px; box-shadow:0 6px 0 var(--ink); padding:6px; display:flex; flex-direction:column; gap:4px; position:relative; }
  .who { display:flex; align-items:center; gap:6px; color:#fff; font-size:13px; text-shadow:0 2px 0 rgba(0,0,0,.45); min-height:24px; flex-wrap:nowrap; white-space:nowrap; }
  .who .nm { font-size:14px; }
  .who .sc { background:rgba(0,0,0,.28); border-radius:999px; padding:0 9px; font-size:12px; }
  .who .sc b { color:var(--yellow); font-weight:400; }
  .who .hc { margin-left:auto; display:flex; }
  .who .hc i { width:12px; height:17px; background:#c0392b; border:1.5px solid #fff; border-radius:3px; margin-left:-6px; display:block; box-shadow:0 1px 0 rgba(0,0,0,.4); }
  .cap { display:flex; gap:8px; min-height:38px; align-items:flex-start; }
  .cap .grp { display:flex; padding-left:8px; min-width:12px; }
  .cap .grp .cd { margin-left:-12px; }
  .cap.small { min-height:36px; }
  .cap.small .cd { width:22px; margin-left:-8px; }
  .cap.small .grp { padding-left:6px; }
  /* 카드 */
  .cd { width:25px; aspect-ratio:104/169; border-radius:12%/7%; position:relative; flex:none; filter:drop-shadow(0 2px 0 rgba(0,0,0,.35)); background:transparent; }
  .cd img.art { display:block; width:100%; height:100%; pointer-events:none; user-select:none; -webkit-user-select:none; -webkit-user-drag:none; }
  .cd.ssang::before, .cd.ssang::after { content:''; position:absolute; bottom:5%; width:25%; aspect-ratio:1; border-radius:50%; background:#d62828; border:.5px solid #fff; box-shadow:0 0 0 .5px rgba(0,0,0,.5); box-sizing:border-box; }
  .cd.ssang::before { right:36%; } .cd.ssang::after { right:7%; }
  .cd.back { background:repeating-linear-gradient(45deg,#c0392b 0 4px,#a93226 4px 8px); border:2px solid #fff; border-radius:12%/7%; box-sizing:border-box; }
  #field .cd, #strip .cd { width:40px; }
  #hand { display:flex; justify-content:center; gap:2px; padding-top:10px; min-height:66px; }
  #hand .cd { width:32px; flex:0 1 32px; min-width:0; cursor:pointer; transition:transform .12s; }
  #hand .cd.sel { transform:translateY(-10px); box-shadow:0 0 0 3px #ffd23f, 0 5px 0 rgba(0,0,0,.35); }
  #hand .cd.dim { filter:brightness(.7); }
  #field { display:flex; gap:6px; align-items:flex-start; min-height:132px; position:relative; }
  #deck { width:44px; flex:none; display:flex; flex-direction:column; align-items:center; gap:2px; color:#fff; font-size:11px; }
  #deck .cd { width:40px; }
  #floor { display:flex; flex-wrap:wrap; gap:4px; flex:1; align-content:flex-start; min-height:128px; }
  #floor .cd.match { box-shadow:0 0 0 3px #ffd23f, 0 0 12px 2px rgba(255,210,63,.9); animation:pulse .6s infinite alternate; cursor:pointer; }
  #floor .cd.opt { box-shadow:0 0 0 3px #ff5fa2, 0 0 12px 2px rgba(255,95,162,.9); animation:pulse .5s infinite alternate; cursor:pointer; }
  #floor .cd.fresh, .cap .cd.fresh { animation:pop .5s; }
  @keyframes pulse { from { filter:brightness(1); } to { filter:brightness(1.18); } }
  @keyframes pop { 0% { transform:scale(.4); } 70% { transform:scale(1.18); } 100% { transform:scale(1); } }
  #strip { width:44px; flex:none; display:flex; flex-direction:column; align-items:center; gap:1px; pointer-events:none; min-height:128px; }
  #strip .lbl { font-size:10px; color:#fff; text-shadow:0 1px 0 rgba(0,0,0,.6); white-space:nowrap; height:12px; }
  #strip .ar { color:#fff; font-size:12px; line-height:1; }
  /* 착착 치는 연출: 날아가는 카드(복사본) 층 */
  #fx { position:absolute; inset:0; pointer-events:none; perspective:700px; z-index:6; }
  .fx { position:absolute; will-change:transform; filter:drop-shadow(0 6px 3px rgba(0,0,0,.35)); }
  .fx .fxi { position:relative; width:100%; height:100%; transform-style:preserve-3d; }
  .fx .ff, .fx .fb { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .fx .fb { transform:rotateY(180deg); }
  .fx .cd { width:100%; height:100%; aspect-ratio:auto; filter:none; }
  .fxring { position:absolute; border-radius:50%; border:3px solid rgba(255,255,255,.9); pointer-events:none; }
  .cd.fx-hide { visibility:hidden !important; }
  #table.hit { animation:hit .15s ease-out; }
  @keyframes hit { 0% { transform:translateY(0); } 30% { transform:translateY(2.5px); } 65% { transform:translateY(-1px); } 100% { transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce) { #table.hit { animation:none; } }
  /* 방금 한 일: 상대와 내가 마지막으로 낸 패 · 뒤집은 패 · 먹은 패 · 뺏은 피 */
  #last { display:flex; flex-direction:column; gap:2px; min-height:60px; }
  #last .lr { display:flex; align-items:center; gap:3px; height:29px; padding:0 6px; border-radius:8px; background:rgba(0,0,0,.22); color:#fff; font-size:10px; white-space:nowrap; overflow:hidden; }
  #last .lr .w { color:var(--yellow); font-size:11px; min-width:22px; }
  #last .lr .t { opacity:.8; }
  #last .lr .t.sp { color:#ffd23f; opacity:1; font-weight:700; }
  #last .lr .t.st { color:#ff9ecb; opacity:1; font-weight:700; }
  #last .lr .t.no { opacity:.7; }
  #last .lr .nt { color:#ffd0d8; }
  #last .lr .gc { display:flex; }
  #last .cd { width:18px; flex:none; filter:none; }
  #last .gc .cd + .cd { margin-left:-8px; }
  #actions { display:flex; gap:6px; justify-content:center; min-height:30px; flex-wrap:wrap; }
  #actions button { font:inherit; font-size:14px; color:var(--ink); background:var(--yellow); border:3px solid var(--ink); border-radius:999px; box-shadow:0 3px 0 var(--ink); padding:2px 12px; cursor:pointer; }
  #actions button:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  #toast { position:absolute; left:0; right:0; top:34%; text-align:center; pointer-events:none; opacity:0; z-index:5; font-size:42px; color:var(--yellow); paint-order:stroke fill; -webkit-text-stroke:7px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #toast.show { animation:toast 1.2s ease-out; }
  @keyframes toast { 0% { opacity:0; transform:scale(.5); } 15% { opacity:1; transform:scale(1.15); } 70% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(1.05); } }
  #msg { min-height:36px; white-space:pre-line; font-size:14px; color:#fff; text-shadow:0 2px 0 var(--ink); text-align:center; line-height:1.3; margin-top:6px; }
  #overlay .brk { font-size:13px; color:var(--ink); background:#fff; border:3px solid var(--ink); border-radius:14px; padding:8px 14px; line-height:1.6; text-align:left; box-shadow:0 4px 0 var(--ink); }
  #overlay .stats { grid-template-columns:auto auto; }
  #overlay .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  #overlay .row button { min-width:0; }
  #overlay input {
    background:#fff; border:3px solid var(--ink); color:var(--ink); box-shadow:0 4px 0 var(--ink);
    font-size:18px; font-family:inherit; text-align:center;
    border-radius:999px; padding:8px 16px; width:210px; user-select:text; outline:none;
  }
  #overlay input::placeholder { color:#a99fc9; }
  #overlay input:focus { box-shadow:0 4px 0 var(--ink), 0 0 0 4px rgba(255,210,63,.6); }
  #overlay .join input { width:124px; letter-spacing:.2em; text-transform:uppercase; }
  #overlay .error { font-size:15px; color:#ffb3c4; min-height:1em; paint-order:stroke fill; -webkit-text-stroke:4px var(--ink); }
  #overlay .back { background:none; border:none; box-shadow:none; color:#fff; font-size:16px; cursor:pointer; padding:6px; font-family:inherit; opacity:.9; min-width:0; }
  #overlay .code { color:var(--yellow); font-weight:400; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); font-size:56px; letter-spacing:.16em; font-variant-numeric:tabular-nums; -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }
  #overlay .dots { display:flex; gap:10px; }
  #overlay .dots span { width:14px; height:14px; border-radius:50%; background:var(--yellow); border:3px solid var(--ink); animation:blink 1.2s infinite; }
  #overlay .dots span:nth-child(2) { animation-delay:.2s; }
  #overlay .dots span:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity:.25; transform:scale(.85); } 40% { opacity:1; transform:scale(1); } }
  @media (max-height:700px) { #field { min-height:124px; } #floor { min-height:120px; } #hand { min-height:62px; } }
</style>
</head>
<body>
<div id="stage">
  <div id="col">
    <div id="hud">
      <div class="item score"><span class="value" id="turn">맞고</span></div>
      <div class="item"><span class="label">누적</span><span class="value" id="total">0</span></div>
      <div class="icons">
        <button id="resignBtn" title="기권" style="display:none">🏳</button>
        <button id="muteBtn" title="소리 (M)">🔊</button>
      </div>
    </div>
    <div id="wrap">
      <div id="table">
        <div class="who" id="oppWho"></div>
        <div class="cap small" id="oppCap"></div>
        <div id="field">
          <div id="deck"></div>
          <div id="floor"></div>
          <div id="strip"></div>
        </div>
        <div class="cap" id="myCap"></div>
        <div class="who" id="meWho"></div>
        <div id="last"></div>
        <div id="actions"></div>
        <div id="hand"></div>
        <div id="toast"></div>
        <div id="fx"></div>
      </div>
      <div id="msg"></div>
      <div id="overlay"></div>
    </div>
  </div>
</div>
<script src="logic.js"></script>
<script src="cards.js"></script>
<script src="game.js"></script>
</body>
</html>
